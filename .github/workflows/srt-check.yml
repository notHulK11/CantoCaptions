name: SRT check

# Checks the .srt files a push or pull request changed, and reports results
# as inline annotations.
#
# Deliberately quiet: the job only fails (and only then emails anyone) when
# a file is actually broken -- not UTF-8, a malformed timestamp, an empty
# subtitle, an end time before its start time. Style-guide issues such as
# line length or short durations are warnings: they show up on the PR and in
# the run's summary page, but never fail the job.
#
# Read-only by design: a pull_request from a fork always gets a read-only
# GITHUB_TOKEN no matter what this `permissions:` block says, so this job
# never pushes or comments, and never modifies any file.

on:
  pull_request:
    paths:
      - "Subtitles/**"
  push:
    branches:
      - main
    paths:
      - "Subtitles/**"

permissions:
  contents: read

# A newer push to the same branch or PR makes an older run's results moot.
concurrency:
  group: srt-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Two commits, so a push can fall back to diffing against its
          # parent (see below).
          fetch-depth: 2

      - name: Determine base and head commits
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # A push's "before" SHA is all-zeros on a branch's first push, and
          # may be unreachable after a force-push. Fall back to the head
          # commit's parent, so only that commit's files get checked rather
          # than every file in the repository.
          if [ "$base" = "0000000000000000000000000000000000000000" ] || \
             ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet "$head^" || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find changed .srt files
        run: |
          python3 .github/scripts/find_changed_srts.py \
            "${{ steps.refs.outputs.base }}" \
            "${{ steps.refs.outputs.head }}" \
            changed_files.bin

      - name: Check subtitle files
        run: python3 .github/scripts/ci_annotate.py --paths-file changed_files.bin
